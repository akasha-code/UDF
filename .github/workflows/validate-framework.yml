name: Validate framework

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate contracts and documentation indexes
        run: python scripts/validate_repository.py
      - name: Test contextual profile derivation
        run: python -m unittest discover -s skills/udf/scripts -p 'test_*.py'
